<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="あ">
  <title>Lær japansk skrift</title>
  <!-- Hiragana あ in the teacher's red token (the app's --red), sitting on
       one notebook rule. The glyph is real type — Noto Sans JP when
       available, the platform's own kana font otherwise. -->
  <style>
    .paper { fill: #F7F2E9 }
    .rule   { stroke: #C7D3E2; stroke-width: 2 }
    .red   { fill: #941520 }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #161D1A }
      .rule   { stroke: #3E5248 }
      .red   { fill: #FF8F87 }
    }
  </style>
  <rect class="paper" width="32" height="32" rx="6"/>
  <line class="rule" x1="5" y1="23" x2="27" y2="23"/>
  <text class="red" x="16" y="22" text-anchor="middle"
        font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, MS Gothic, sans-serif"
        font-size="20">あ</text>
</svg>
